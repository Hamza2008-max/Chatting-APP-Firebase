<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaChat</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <div id="auth-screen" class="auth-card">
      <div class="brand">
        <div class="brand-badge">✦</div>
        <h1>NovaChat</h1>
      </div>

      <div class="auth-toggle" aria-label="Authentication mode switcher">
        <button id="show-login" class="mode-btn active" type="button">Login</button>
        <button id="show-signup" class="mode-btn" type="button">Sign Up</button>
      </div>

      <p id="auth-subtitle" class="auth-subtitle">Welcome back! Sign in to continue your conversations.</p>

      <form id="login-panel" class="auth-form">
        <div class="input-group">
          <input type="email" id="login-email" placeholder="Email address" required />
        </div>

        <div class="input-group">
          <input type="password" id="login-pass" placeholder="Password" required />
        </div>

        <button id="sign-in-btn" class="primary-btn" type="submit">Login</button>
        <p class="auth-switch-text">Need an account? <button id="switch-to-signup" class="link-btn" type="button">Sign Up</button></p>
      </form>

      <form id="signup-panel" class="auth-form hidden">
        <div class="input-group">
          <input type="text" id="signup-name" placeholder="Full name" required />
        </div>

        <div class="input-group">
          <input type="email" id="signup-email" placeholder="Email address" required />
        </div>

        <div class="input-group">
          <input type="password" id="signup-pass" placeholder="Create password" required />
        </div>

        <button id="sign-up-btn" class="primary-btn" type="submit">Create Account</button>
        <p class="auth-switch-text">Already have an account? <button id="switch-to-login" class="link-btn" type="button">Login</button></p>
      </form>
    </div>

    <div id="chat-screen" class="chat-app hidden">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="user-info">
            <div class="avatar">N</div>
            <div class="user-meta">
              <span class="user-label">Logged in</span>
              <span id="current-user-email" class="user-email">user@example.com</span>
            </div>
          </div>
          <button id="logout-btn" class="ghost-btn" type="button">Logout</button>
        </div>

        <div class="new-chat-box">
          <input id="recipient-email" type="email" placeholder="Add a friend by email" />
          <button id="new-chat-btn" class="secondary-btn" type="button">Add</button>
        </div>

        <div id="chat-list" class="chat-list"></div>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div class="chat-title-group">
            <div class="chat-title-avatar" id="active-chat-avatar">N</div>
            <div>
              <h3 id="active-chat-title">Select a chat</h3>
              <div class="chat-status">Online</div>
            </div>
          </div>
        </header>

        <section id="messages-box" class="messages"></section>

        <div class="chat-composer">
          <input id="message-input" type="text" placeholder="Type a message..." />
          <button id="send-btn" class="chat-send-btn" type="button">Send</button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
