<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080919" />
    <title>Sign Up - NovaChat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-3">
      <span class="navbar-brand mb-0 h1">NovaChat</span>
    </nav>

    <div class="auth-wrapper">
      <div class="card shadow-sm auth-container">
        <div class="card-body p-4">
          <form id="signup-form" class="d-flex flex-column gap-3">
            <div class="auth-heading">
              <span class="auth-logo" aria-hidden="true"></span>
              <h2 class="h4 text-center mb-1">Create your account</h2>
              <p class="auth-subtitle">Join NovaChat and start messaging</p>
            </div>
            <div class="field">
              <label class="field-label" for="signup-name">Full name</label>
              <input
                type="text"
                id="signup-name"
                class="form-control"
                placeholder="Your full name"
                required
              />
            </div>
            <div class="field">
              <label class="field-label" for="signup-email">Email address</label>
              <input
                type="email"
                id="signup-email"
                class="form-control"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="field">
              <label class="field-label" for="signup-password">Password</label>
              <input
                type="password"
                id="signup-password"
                class="form-control"
                placeholder="Create a password"
                minlength="6"
                required
              />
              <p class="field-hint">Use at least 6 characters.</p>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            <p class="text-center text-muted small mb-0">
              Already have an account?
              <a href="./login.html">Login</a>
            </p>
          </form>
          <p id="auth-error" class="text-danger small text-center mt-3 mb-0 hidden"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./signup.js"></script>
  </body>
</html>
